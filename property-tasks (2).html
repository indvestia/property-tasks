<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Property Tasks">
<title>Property Task Manager</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.x/dist/tabler-icons.min.css">
<style>
  :root {
    --bg: #ffffff; --bg2: #f5f5f4; --bg3: #eeece8;
    --text: #1a1a1a; --text2: #6b6b6b; --text3: #999;
    --border: rgba(0,0,0,0.12); --border2: rgba(0,0,0,0.22);
    --radius: 10px; --radius-lg: 14px;
    --green: #1D9E75; --green-bg: #E1F5EE; --green-text: #0F6E56;
    --amber: #BA7517; --amber-bg: #FAEEDA; --amber-text: #854F0B;
    --blue: #185FA5; --blue-bg: #E6F1FB; --blue-text: #0C447C;
    --pink-bg: #FBEAF0; --pink-text: #993556;
    --red: #C0392B; --red-bg: #FDECEA; --red-text: #8B1A12;
    --yellow-bg: #FFFBEA; --yellow-text: #7A5C00; --yellow-border: #F5D87A;
    --safe-top: env(safe-area-inset-top, 0px);
    --safe-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1c1c1e; --bg2: #2c2c2e; --bg3: #3a3a3c;
      --text: #f0f0f0; --text2: #aeaeb2; --text3: #6e6e73;
      --border: rgba(255,255,255,0.1); --border2: rgba(255,255,255,0.2);
      --green-bg: #0a3d2c; --green-text: #5DCAA5;
      --amber-bg: #3d2800; --amber-text: #FAC775;
      --blue-bg: #0a2340; --blue-text: #85B7EB;
      --pink-bg: #3d0f20; --pink-text: #ED93B1;
      --red-bg: #3d0a08; --red-text: #F08080;
      --yellow-bg: #2e2600; --yellow-text: #F5D87A; --yellow-border: #7A6000;
    }
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: var(--bg3); color: var(--text); min-height: 100vh; padding-bottom: calc(80px + var(--safe-bottom)); }

  .header { background: var(--bg); border-bottom: 0.5px solid var(--border); padding: calc(var(--safe-top) + 12px) 16px 12px; position: sticky; top: 0; z-index: 100; }
  .header-row { display: flex; align-items: center; gap: 10px; }
  .header h1 { font-size: 20px; font-weight: 600; flex: 1; }
  .week-lbl { font-size: 12px; color: var(--text2); margin-top: 2px; }
  .header-btn { background: var(--bg2); border: none; border-radius: 8px; padding: 7px 12px; font-size: 13px; color: var(--text); cursor: pointer; display: flex; align-items: center; gap: 5px; white-space: nowrap; }
  .header-btn:active { opacity: 0.7; }

  /* Deadline banner */
  .deadline-banner { margin: 10px 12px 0; border-radius: var(--radius); overflow: hidden; }
  .banner-overdue { background: var(--red-bg); border: 0.5px solid #F5A8A3; }
  .banner-soon { background: var(--yellow-bg); border: 0.5px solid var(--yellow-border); }
  .banner-header { display: flex; align-items: center; gap: 8px; padding: 9px 12px; cursor: pointer; }
  .banner-header:active { opacity: 0.8; }
  .banner-title { font-size: 13px; font-weight: 600; flex: 1; }
  .banner-overdue .banner-title { color: var(--red-text); }
  .banner-soon .banner-title { color: var(--yellow-text); }
  .banner-item { font-size: 12px; padding: 5px 12px; border-top: 0.5px solid rgba(0,0,0,0.08); }
  .banner-overdue .banner-item { color: var(--red-text); }
  .banner-soon .banner-item { color: var(--yellow-text); }

  .stats { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; padding: 12px 12px 0; }
  .stat { background: var(--bg); border-radius: var(--radius); padding: 10px 8px; text-align: center; }
  .stat-val { font-size: 20px; font-weight: 600; }
  .stat-lbl { font-size: 10px; color: var(--text2); margin-top: 2px; }
  .s-green { color: var(--green); } .s-amber { color: var(--amber); } .s-blue { color: var(--blue); } .s-red { color: var(--red); }

  .controls { padding: 10px 12px; display: flex; gap: 8px; }
  .controls input, .controls select { background: var(--bg); border: 0.5px solid var(--border2); border-radius: 10px; padding: 8px 12px; font-size: 14px; color: var(--text); flex: 1; min-width: 0; outline: none; }
  .controls select { flex: 0 0 auto; max-width: 150px; }

  .prop-group { margin: 0 12px 10px; background: var(--bg); border-radius: var(--radius-lg); overflow: hidden; border: 0.5px solid var(--border); }
  .prop-group.has-overdue { border-color: #F5A8A3; }
  .prop-group.has-soon { border-color: var(--yellow-border); }
  .prop-header { display: flex; align-items: center; gap: 8px; padding: 12px 14px; cursor: pointer; user-select: none; }
  .prop-header:active { background: var(--bg2); }
  .prop-name { font-size: 15px; font-weight: 500; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .badge { font-size: 11px; padding: 2px 7px; border-radius: 20px; font-weight: 500; white-space: nowrap; }
  .b-open { background: var(--amber-bg); color: var(--amber-text); }
  .b-done { background: var(--green-bg); color: var(--green-text); }
  .b-carried { background: var(--blue-bg); color: var(--blue-text); }
  .b-overdue { background: var(--red-bg); color: var(--red-text); }
  .chevron { font-size: 14px; color: var(--text3); transition: transform 0.15s; flex-shrink: 0; }
  .chevron.open { transform: rotate(90deg); }

  .task-row { border-top: 0.5px solid var(--border); }
  .task-row.overdue { background: var(--red-bg); }
  .task-row.due-soon { background: var(--yellow-bg); }
  .task-main { display: flex; align-items: flex-start; gap: 8px; padding: 11px 14px; }
  .task-check { width: 20px; height: 20px; accent-color: var(--green); cursor: pointer; flex-shrink: 0; margin-top: 1px; }
  .task-body { flex: 1; min-width: 0; }
  .task-text { font-size: 14px; }
  .task-text.done { text-decoration: line-through; color: var(--text3); }
  .task-meta { display: flex; align-items: center; gap: 5px; margin-top: 4px; flex-wrap: wrap; }
  .task-cat { font-size: 11px; padding: 2px 7px; border-radius: 20px; white-space: nowrap; }
  .c-maint { background: var(--blue-bg); color: var(--blue-text); }
  .c-fin { background: var(--green-bg); color: var(--green-text); }
  .c-tenant { background: var(--pink-bg); color: var(--pink-text); }
  .c-insp { background: var(--amber-bg); color: var(--amber-text); }
  .due-chip { font-size: 11px; padding: 2px 7px; border-radius: 20px; white-space: nowrap; display: flex; align-items: center; gap: 3px; }
  .due-chip.overdue { background: var(--red-bg); color: var(--red-text); font-weight: 600; }
  .due-chip.due-today { background: var(--amber-bg); color: var(--amber-text); font-weight: 600; }
  .due-chip.due-soon { background: var(--yellow-bg); color: var(--yellow-text); }
  .due-chip.due-later { background: var(--bg2); color: var(--text2); }
  .c-carried { background: var(--blue-bg); color: var(--blue-text); font-size: 11px; padding: 2px 7px; border-radius: 20px; white-space: nowrap; }
  .task-actions { display: flex; gap: 2px; flex-shrink: 0; }
  .icon-btn { background: none; border: none; padding: 5px; font-size: 17px; color: var(--text3); cursor: pointer; border-radius: 6px; }
  .icon-btn:active { background: var(--bg3); }
  .icon-btn.active { color: var(--blue); }
  .icon-btn.carry-on { color: var(--blue); }

  .note-preview { font-size: 12px; color: var(--text2); padding: 0 14px 9px 46px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .note-area { padding: 4px 14px 10px 46px; }
  .note-area textarea { width: 100%; background: var(--bg2); border: 0.5px solid var(--border2); border-radius: 8px; padding: 8px 10px; font-size: 13px; color: var(--text); resize: none; min-height: 60px; font-family: inherit; outline: none; }

  /* Date picker row inside note area */
  .date-row { display: flex; align-items: center; gap: 8px; padding: 0 14px 10px 46px; }
  .date-row label { font-size: 12px; color: var(--text2); white-space: nowrap; }
  .date-row input[type=date] { flex: 1; background: var(--bg2); border: 0.5px solid var(--border2); border-radius: 8px; padding: 6px 10px; font-size: 13px; color: var(--text); outline: none; }
  .date-row button { background: none; border: none; font-size: 13px; color: var(--text3); cursor: pointer; padding: 4px; }

  .add-row { display: flex; gap: 6px; padding: 10px 14px; border-top: 0.5px solid var(--border); flex-wrap: wrap; }
  .add-row input[type=text] { flex: 1; min-width: 120px; background: var(--bg2); border: 0.5px solid var(--border); border-radius: 8px; padding: 7px 10px; font-size: 13px; color: var(--text); outline: none; }
  .add-row select { background: var(--bg2); border: 0.5px solid var(--border); border-radius: 8px; padding: 7px 6px; font-size: 12px; color: var(--text); outline: none; }
  .add-row input[type=date] { background: var(--bg2); border: 0.5px solid var(--border); border-radius: 8px; padding: 7px 8px; font-size: 12px; color: var(--text); outline: none; width: 130px; }
  .add-row button { background: var(--bg2); border: 0.5px solid var(--border2); border-radius: 8px; padding: 7px 12px; font-size: 13px; color: var(--text); cursor: pointer; white-space: nowrap; }
  .add-row button:active { opacity: 0.7; }

  .bottom-bar { position: fixed; bottom: 0; left: 0; right: 0; background: var(--bg); border-top: 0.5px solid var(--border); padding: 10px 16px calc(10px + var(--safe-bottom)); display: flex; gap: 8px; z-index: 100; }
  .bottom-bar input { flex: 1; background: var(--bg2); border: 0.5px solid var(--border2); border-radius: 10px; padding: 9px 12px; font-size: 14px; color: var(--text); outline: none; }
  .bottom-bar button { background: var(--bg2); border: 0.5px solid var(--border2); border-radius: 10px; padding: 9px 14px; font-size: 14px; color: var(--text); cursor: pointer; white-space: nowrap; }
  .bottom-bar button:active { opacity: 0.7; }

  .modal-bg { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 200; align-items: flex-end; }
  .modal-bg.show { display: flex; }
  .modal { background: var(--bg); border-radius: 20px 20px 0 0; padding: 20px 20px calc(20px + var(--safe-bottom)); width: 100%; }
  .modal h2 { font-size: 17px; font-weight: 600; margin-bottom: 8px; }
  .modal p { font-size: 14px; color: var(--text2); margin-bottom: 16px; line-height: 1.5; }
  .modal-btns { display: flex; flex-direction: column; gap: 8px; }
  .modal-btn { padding: 14px; border-radius: 12px; border: none; font-size: 15px; cursor: pointer; text-align: center; }
  .modal-btn:active { opacity: 0.8; }
  .btn-carry { background: var(--blue-bg); color: var(--blue-text); font-weight: 500; }
  .btn-fresh { background: var(--bg2); color: var(--text); }
  .btn-cancel { background: var(--bg2); color: var(--text2); }

  .empty { padding: 12px 14px; font-size: 13px; color: var(--text3); }
  .section-pad { height: 12px; }
</style>
</head>
<body>

<div class="header">
  <div class="header-row">
    <h1>🏠 Property Tasks</h1>
    <button class="header-btn" onclick="openNewWeekModal()">
      <i class="ti ti-calendar-plus"></i> New week
    </button>
  </div>
  <div class="week-lbl" id="week-lbl"></div>
</div>

<div id="banners"></div>

<div class="stats">
  <div class="stat"><div class="stat-val" id="s-props">0</div><div class="stat-lbl">Props</div></div>
  <div class="stat"><div class="stat-val" id="s-total">0</div><div class="stat-lbl">Tasks</div></div>
  <div class="stat"><div class="stat-val s-green" id="s-done">0</div><div class="stat-lbl">Done</div></div>
  <div class="stat"><div class="stat-val s-amber" id="s-open">0</div><div class="stat-lbl">Open</div></div>
  <div class="stat"><div class="stat-val s-red" id="s-overdue">0</div><div class="stat-lbl">Overdue</div></div>
</div>

<div class="controls">
  <input type="search" id="search" placeholder="Search…" oninput="render()">
  <select id="filter" onchange="render()">
    <option value="">All tasks</option>
    <option value="overdue">🔴 Overdue</option>
    <option value="due-soon">🟡 Due soon</option>
    <option value="open">Open</option>
    <option value="done">Done</option>
    <option value="carried">Carried fwd</option>
    <option value="noted">Has notes</option>
    <option value="maintenance">Maintenance</option>
    <option value="financial">Financial</option>
    <option value="tenant">Tenant</option>
    <option value="inspection">Inspection</option>
  </select>
</div>

<div id="list"></div>
<div class="section-pad"></div>

<div class="bottom-bar">
  <input type="text" id="new-prop" placeholder="Add property address…">
  <button onclick="addProperty()"><i class="ti ti-plus"></i> Add</button>
</div>

<div class="modal-bg" id="modal">
  <div class="modal">
    <h2>Start new week</h2>
    <p id="modal-msg"></p>
    <div class="modal-btns">
      <button class="modal-btn btn-carry" onclick="doNewWeek(true)">
        <i class="ti ti-arrow-forward"></i> Carry forward incomplete tasks
      </button>
      <button class="modal-btn btn-fresh" onclick="doNewWeek(false)">
        Start fresh — clear all tasks
      </button>
      <button class="modal-btn btn-cancel" onclick="closeModal()">Cancel</button>
    </div>
  </div>
</div>

<script>
const CATS = ['maintenance','financial','tenant','inspection'];
const CAT_CLASS = {maintenance:'c-maint',financial:'c-fin',tenant:'c-tenant',inspection:'c-insp'};
let openNotes = {};

function defaultData() {
  return { weekOf: getMondayStr(new Date()), properties: [], nextPropId: 1, nextTaskId: 1 };
}

function load() {
  try { const r = localStorage.getItem('ptm_v2'); return r ? JSON.parse(r) : defaultData(); }
  catch(e) { return defaultData(); }
}
function save() { try { localStorage.setItem('ptm_v2', JSON.stringify(data)); } catch(e) {} }

let data = load();

function getMondayStr(d) {
  const m = new Date(d);
  m.setDate(d.getDate() - ((d.getDay()+6)%7));
  return m.toISOString().slice(0,10);
}
function nextMondayStr(s) {
  const d = new Date(s+'T00:00:00');
  d.setDate(d.getDate()+7);
  return d.toISOString().slice(0,10);
}
function weekLabel(s) {
  const m = new Date(s+'T00:00:00'), e = new Date(m);
  e.setDate(m.getDate()+6);
  const f = d => d.toLocaleDateString('en-US',{month:'short',day:'numeric'});
  return 'Week of ' + f(m) + ' – ' + f(e);
}

function todayStr() { return new Date().toISOString().slice(0,10); }

function dueDiff(dueDateStr) {
  if (!dueDateStr) return null;
  const today = new Date(todayStr()+'T00:00:00');
  const due = new Date(dueDateStr+'T00:00:00');
  return Math.round((due - today) / 86400000);
}

function dueStatus(task) {
  if (task.done || !task.due) return null;
  const diff = dueDiff(task.due);
  if (diff < 0) return 'overdue';
  if (diff === 0) return 'due-today';
  if (diff <= 3) return 'due-soon';
  return 'due-later';
}

function dueLabel(task) {
  if (!task.due) return null;
  const diff = dueDiff(task.due);
  const d = new Date(task.due+'T00:00:00');
  const dateStr = d.toLocaleDateString('en-US',{month:'short',day:'numeric'});
  if (diff < 0) return `Overdue by ${Math.abs(diff)}d`;
  if (diff === 0) return 'Due today';
  if (diff === 1) return 'Due tomorrow';
  return `Due ${dateStr}`;
}

function renderBanners() {
  const today = todayStr();
  const overdue = [], soon = [];
  data.properties.forEach(p => {
    p.tasks.forEach(t => {
      if (t.done || !t.due) return;
      const s = dueStatus(t);
      if (s === 'overdue') overdue.push({prop: p.name, task: t});
      else if (s === 'due-today' || s === 'due-soon') soon.push({prop: p.name, task: t});
    });
  });

  const container = document.getElementById('banners');
  container.innerHTML = '';

  if (overdue.length > 0) {
    const b = document.createElement('div');
    b.className = 'deadline-banner banner-overdue';
    const h = document.createElement('div');
    h.className = 'banner-header';
    const collapsed = sessionStorage.getItem('banner-overdue-collapsed') === '1';
    h.innerHTML = `<i class="ti ti-alert-circle" style="font-size:16px;color:var(--red-text)"></i><span class="banner-title">🔴 ${overdue.length} overdue task${overdue.length>1?'s':''}</span><i class="ti ti-chevron-${collapsed?'down':'up'}" style="color:var(--red-text);font-size:13px"></i>`;
    h.onclick = () => {
      const c = sessionStorage.getItem('banner-overdue-collapsed')==='1';
      sessionStorage.setItem('banner-overdue-collapsed', c?'0':'1');
      renderBanners();
    };
    b.appendChild(h);
    if (!collapsed) {
      overdue.forEach(({prop, task}) => {
        const item = document.createElement('div');
        item.className = 'banner-item';
        item.textContent = `${prop} — ${task.text} (${dueLabel(task)})`;
        b.appendChild(item);
      });
    }
    container.appendChild(b);
  }

  if (soon.length > 0) {
    const b = document.createElement('div');
    b.className = 'deadline-banner banner-soon';
    const h = document.createElement('div');
    h.className = 'banner-header';
    const collapsed = sessionStorage.getItem('banner-soon-collapsed') === '1';
    h.innerHTML = `<i class="ti ti-clock" style="font-size:16px;color:var(--yellow-text)"></i><span class="banner-title">🟡 ${soon.length} due soon</span><i class="ti ti-chevron-${collapsed?'down':'up'}" style="color:var(--yellow-text);font-size:13px"></i>`;
    h.onclick = () => {
      const c = sessionStorage.getItem('banner-soon-collapsed')==='1';
      sessionStorage.setItem('banner-soon-collapsed', c?'0':'1');
      renderBanners();
    };
    b.appendChild(h);
    if (!collapsed) {
      soon.forEach(({prop, task}) => {
        const item = document.createElement('div');
        item.className = 'banner-item';
        item.textContent = `${prop} — ${task.text} (${dueLabel(task)})`;
        b.appendChild(item);
      });
    }
    container.appendChild(b);
  }
}

function updateStats() {
  let total=0, done=0, overdue=0;
  data.properties.forEach(p => {
    total += p.tasks.length;
    done += p.tasks.filter(t=>t.done).length;
    overdue += p.tasks.filter(t=>!t.done && dueStatus(t)==='overdue').length;
  });
  document.getElementById('s-props').textContent = data.properties.length;
  document.getElementById('s-total').textContent = total;
  document.getElementById('s-done').textContent = done;
  document.getElementById('s-open').textContent = total - done;
  document.getElementById('s-overdue').textContent = overdue;
}

function render() {
  const search = (document.getElementById('search').value||'').toLowerCase();
  const filt = document.getElementById('filter').value;
  const list = document.getElementById('list');
  list.innerHTML = '';

  data.properties.forEach(prop => {
    let tasks = prop.tasks.filter(t => {
      const ds = dueStatus(t);
      if (filt==='overdue' && ds!=='overdue') return false;
      if (filt==='due-soon' && ds!=='due-today' && ds!=='due-soon') return false;
      if (filt==='open' && t.done) return false;
      if (filt==='done' && !t.done) return false;
      if (filt==='carried' && !t.carried) return false;
      if (filt==='noted' && !t.note) return false;
      if (['maintenance','financial','tenant','inspection'].includes(filt) && t.cat!==filt) return false;
      if (search && !t.text.toLowerCase().includes(search) && !prop.name.toLowerCase().includes(search)) return false;
      return true;
    });
    if (search && !prop.name.toLowerCase().includes(search) && tasks.length===0) return;

    const openCnt = tasks.filter(t=>!t.done).length;
    const doneCnt = tasks.filter(t=>t.done).length;
    const carriedCnt = tasks.filter(t=>t.carried).length;
    const overdueCnt = tasks.filter(t=>!t.done && dueStatus(t)==='overdue').length;

    const hasOverdue = prop.tasks.some(t=>!t.done && dueStatus(t)==='overdue');
    const hasSoon = !hasOverdue && prop.tasks.some(t=>!t.done && (dueStatus(t)==='due-today'||dueStatus(t)==='due-soon'));

    const grp = document.createElement('div');
    grp.className = 'prop-group' + (hasOverdue?' has-overdue':hasSoon?' has-soon':'');

    const hdr = document.createElement('div');
    hdr.className = 'prop-header';
    hdr.innerHTML = `
      <i class="ti ti-home" style="font-size:17px;color:var(--text3);flex-shrink:0"></i>
      <span class="prop-name">${esc(prop.name)}</span>
      ${overdueCnt>0?`<span class="badge b-overdue">⚠ ${overdueCnt}</span>`:''}
      ${openCnt>0?`<span class="badge b-open">${openCnt}</span>`:''}
      ${doneCnt>0?`<span class="badge b-done">${doneCnt}</span>`:''}
      ${carriedCnt>0?`<span class="badge b-carried"><i class="ti ti-arrow-forward" style="font-size:10px"></i>${carriedCnt}</span>`:''}
      <i class="ti ti-chevron-right chevron ${prop.open?'open':''}"></i>
    `;
    hdr.onclick = () => { prop.open=!prop.open; save(); render(); };
    grp.appendChild(hdr);

    if (prop.open) {
      const rows = document.createElement('div');
      if (tasks.length===0) rows.innerHTML = `<div class="empty">No tasks yet — add one below.</div>`;

      tasks.forEach(task => {
        const noteOpen = !!openNotes[task.id];
        const ds = dueStatus(task);
        const wrap = document.createElement('div');
        wrap.className = 'task-row' + (ds==='overdue'?' overdue':((ds==='due-today'||ds==='due-soon')?' due-soon':''));

        const main = document.createElement('div');
        main.className = 'task-main';
        main.innerHTML = `
          <input type="checkbox" class="task-check" ${task.done?'checked':''}>
          <div class="task-body">
            <div class="task-text${task.done?' done':''}">${esc(task.text)}</div>
            <div class="task-meta">
              <span class="task-cat ${CAT_CLASS[task.cat]}">${task.cat}</span>
              ${task.due && !task.done ? `<span class="due-chip ${ds}"><i class="ti ti-calendar" style="font-size:10px"></i>${dueLabel(task)}</span>` : ''}
              ${task.carried?`<span class="c-carried"><i class="ti ti-arrow-forward" style="font-size:10px"></i> carried</span>`:''}
            </div>
          </div>
          <div class="task-actions">
            <button class="icon-btn${(task.note||noteOpen)?' active':''}" title="Notes"><i class="ti ti-notes"></i></button>
            <button class="icon-btn${task.carried?' carry-on':''}" title="Carry forward"><i class="ti ti-arrow-forward"></i></button>
            <button class="icon-btn del-btn" title="Delete"><i class="ti ti-x"></i></button>
          </div>
        `;
        main.querySelector('.task-check').onchange = e => { task.done=e.target.checked; save(); render(); };
        main.querySelectorAll('.icon-btn')[0].onclick = () => {
          if(openNotes[task.id]) delete openNotes[task.id]; else openNotes[task.id]=true;
          render();
        };
        main.querySelectorAll('.icon-btn')[1].onclick = () => { task.carried=!task.carried; save(); render(); };
        main.querySelector('.del-btn').onclick = () => {
          if(confirm('Delete this task?')) {
            prop.tasks=prop.tasks.filter(t=>t.id!==task.id);
            delete openNotes[task.id]; save(); render();
          }
        };
        wrap.appendChild(main);

        // Note preview or textarea
        if (task.note && !noteOpen) {
          const prev = document.createElement('div');
          prev.className = 'note-preview';
          prev.textContent = task.note;
          wrap.appendChild(prev);
        }
        if (noteOpen) {
          // Date picker row
          const dr = document.createElement('div');
          dr.className = 'date-row';
          dr.innerHTML = `
            <label><i class="ti ti-calendar" style="font-size:13px;margin-right:3px"></i>Due date</label>
            <input type="date" value="${task.due||''}">
            ${task.due?`<button title="Clear date"><i class="ti ti-x"></i></button>`:''}
          `;
          dr.querySelector('input').onchange = e => { task.due=e.target.value||null; save(); render(); };
          if (task.due) dr.querySelector('button').onclick = () => { task.due=null; save(); render(); };
          wrap.appendChild(dr);

          const na = document.createElement('div');
          na.className = 'note-area';
          const ta = document.createElement('textarea');
          ta.placeholder = 'Notes on this task…';
          ta.value = task.note||'';
          ta.rows = 3;
          ta.oninput = e => { task.note=e.target.value; save(); };
          ta.onblur = () => { if(!task.note && !task.due) delete openNotes[task.id]; render(); };
          na.appendChild(ta);
          wrap.appendChild(na);
          setTimeout(()=>ta.focus(),50);
        }
        rows.appendChild(wrap);
      });

      const addRow = document.createElement('div');
      addRow.className = 'add-row';
      addRow.innerHTML = `
        <input type="text" placeholder="New task…" id="nt-${prop.id}">
        <select id="nc-${prop.id}">${CATS.map(c=>`<option value="${c}">${c.slice(0,4)}</option>`).join('')}</select>
        <input type="date" id="nd-${prop.id}" title="Optional due date">
        <button>Add</button>
      `;
      addRow.querySelector('input[type=text]').onkeydown = e => { if(e.key==='Enter') addTask(prop.id); };
      addRow.querySelector('button').onclick = () => addTask(prop.id);
      rows.appendChild(addRow);
      grp.appendChild(rows);
    }
    list.appendChild(grp);
  });

  updateStats();
  renderBanners();
}

function addTask(propId) {
  const inp = document.getElementById('nt-'+propId);
  const cat = document.getElementById('nc-'+propId);
  const due = document.getElementById('nd-'+propId);
  const text = inp.value.trim();
  if(!text) return;
  const prop = data.properties.find(p=>p.id===propId);
  prop.tasks.push({id:data.nextTaskId++, text, cat:cat.value, done:false, carried:false, note:'', due: due.value||null});
  inp.value=''; due.value='';
  save(); render();
}

function addProperty() {
  const inp = document.getElementById('new-prop');
  const name = inp.value.trim();
  if(!name) return;
  data.properties.push({id:data.nextPropId++, name, open:true, tasks:[]});
  inp.value='';
  save(); render();
}

function openNewWeekModal() {
  let incomplete=0;
  data.properties.forEach(p=>p.tasks.forEach(t=>{if(!t.done)incomplete++;}));
  document.getElementById('modal-msg').textContent =
    `You have ${incomplete} incomplete task${incomplete!==1?'s':''} this week. Carry them forward (keeping notes and due dates), or start completely fresh.`;
  document.getElementById('modal').classList.add('show');
}
function closeModal() { document.getElementById('modal').classList.remove('show'); }
document.getElementById('modal').onclick = e => { if(e.target===document.getElementById('modal')) closeModal(); };

function doNewWeek(carry) {
  data.weekOf = nextMondayStr(data.weekOf);
  openNotes = {};
  data.properties.forEach(p => {
    if(carry) {
      p.tasks = p.tasks.filter(t=>!t.done).map(t=>({...t, carried:true, done:false}));
    } else {
      p.tasks = [];
    }
  });
  closeModal();
  document.getElementById('week-lbl').textContent = weekLabel(data.weekOf);
  save(); render();
}

function esc(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

document.getElementById('week-lbl').textContent = weekLabel(data.weekOf);
render();
</script>
</body>
</html>
